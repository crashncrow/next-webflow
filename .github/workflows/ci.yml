name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only check out code and run checks.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloads exactly the pnpm in package.json's `packageManager` (no bootstrap version +
      # self-update), installs Node.js from .nvmrc, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm format:check # whole repo, incl. spikes/ and docs (skips .prettierignore and .gitignore)
      - run: pnpm lint # library and examples
      - run: pnpm build # first: examples type-check against dist/, and the Node ESM import test needs it
      # Library + examples/blog. The example's schema is committed, so this catches library changes
      # that break the example, not Webflow API changes (contract.yml covers those).
      - run: pnpm typecheck
      - run: pnpm test # node + edge projects, edge bundle check (contract test: contract.yml)

  # The library's tests on the lowest Node.js it supports (packages/next-webflow `engines`) and on
  # the latest LTS. Users' floor, not the dev toolchain's: install and build run on .nvmrc first
  # (tsdown needs >=22.18), then the runtime switches to the matrix version for the tests.
  library-node:
    name: library tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0: the floor (Vitest 5 and MSW need it). 24: the most common version among users
        # for a while, kept after `lts` moves on. `lts` follows Node's active LTS (26 from 2026-10-28).
        node: ["22.12.0", "24", "lts"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false # the `check` job saves the store
          require-lockfile: true
      - run: pnpm build
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ matrix.node }}
          install: false
      # Fails if the switch didn't happen, so the job can't pass on the wrong Node.
      - name: Check the Node version
        env:
          WANTED: ${{ matrix.node }}
        run: |
          GOT="$(node --version)"
          echo "Wanted: $WANTED, got: $GOT"
          case "$WANTED" in
            lts) [ "$GOT" != "v$(cat .nvmrc)" ] || { echo "::error::Still on the dev Node ($GOT), not the latest LTS"; exit 1; } ;;
            *.*.*) [ "$GOT" = "v$WANTED" ] || { echo "::error::Expected Node v$WANTED, got $GOT"; exit 1; } ;;
            *) case "$GOT" in "v$WANTED".*) ;; *) echo "::error::Expected Node $WANTED.x, got $GOT"; exit 1 ;; esac ;;
          esac
      - run: pnpm --filter next-webflow test

  # The library's tests with Next.js 15 (peerDependencies: ^15 || ^16; everything else runs on 16).
  # Builds on 16 first, then swaps the library's dev copy of next to the latest 15. The swap edits
  # package.json and the lockfile in this throwaway checkout only. No `tsc`: the source passes two
  # arguments to revalidateTag (Next 16's signature), which Next 15's types reject; the published
  # types don't depend on it.
  library-next15:
    name: library tests (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false # the `check` job saves the store
          require-lockfile: true
      - run: pnpm build
      - run: pnpm --filter next-webflow add --save-dev "next@^15"
      # Fails if the swap didn't happen, so the job can't pass on Next 16.
      - name: Check the Next.js version
        working-directory: packages/next-webflow
        run: |
          GOT="$(node -p 'require("next/package.json").version')"
          echo "Next.js $GOT"
          case "$GOT" in 15.*) ;; *) echo "::error::Expected Next.js 15.x, got $GOT"; exit 1 ;; esac
      - run: pnpm --filter next-webflow test
