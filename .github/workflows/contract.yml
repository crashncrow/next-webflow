name: Contract (real Webflow API)

# Checks that the real Webflow API still matches our fixtures, against the TEST site only.
# Never runs on pull requests (forks must not reach the secret): schedule and manual runs only.
on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract
  cancel-in-progress: false

jobs:
  contract:
    # Forks get the schedule too, but not the secret.
    if: github.repository == 'crashncrow/next-webflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the secrets
        env:
          WEBFLOW_CMS_TOKEN: ${{ secrets.WEBFLOW_CONTRACT_CMS_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_CONTRACT_SITE_ID }}
        # Without them the suite would be skipped and the run would pass silently.
        run: |
          if [ -z "$WEBFLOW_CMS_TOKEN" ] || [ -z "$WEBFLOW_SITE_ID" ]; then
            echo "::error::Set the WEBFLOW_CONTRACT_CMS_TOKEN and WEBFLOW_CONTRACT_SITE_ID repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v7
      # Downloads exactly the pnpm in package.json's `packageManager` (no bootstrap version +
      # self-update), installs Node.js from .nvmrc, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # On drift it fails with one line per changed key, also in the run summary. With `CI` set
      # (always on GitHub) it prints only that summary: logs of a public repo are public, and the
      # full output (real field values, URLs, IDs) stays on the runner. No artifact either: public
      # repos' artifacts can be downloaded by anyone signed in to GitHub.
      - run: pnpm test:contract
        env:
          WEBFLOW_CONTRACT: "1"
          # Read-only site token (CMS: Read) of the test site, and its site ID. Only this step
          # sees them (not `pnpm install` and its build scripts).
          WEBFLOW_CMS_TOKEN: ${{ secrets.WEBFLOW_CONTRACT_CMS_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_CONTRACT_SITE_ID }}
